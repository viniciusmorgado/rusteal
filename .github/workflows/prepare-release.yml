name: Prepare release

# Runs on every pull request that targets main. It works out the next version from the
# commits the PR brings and commits it to [workspace.package] ON THE PR BRANCH (develop),
# so that main receives the final version with the merge and the release workflow only has
# to publish. A push made here re-triggers this workflow, which then finds nothing to change.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: prepare-release-${{ github.head_ref }}
  cancel-in-progress: true

# The job commits the version to the pull request branch; the default token is
# read-only in a new repository.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The crate whose published version anchors the workspace: they all share one version.
  ANCHOR_CRATE: rusteal

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # A merge that changes only workflows, documentation or examples has
      # nothing to release: the packages would be identical to the ones already
      # on crates.io. Paths that end up inside a package (every crate, plus the
      # UE plugin the CLI embeds and the workspace manifest) decide it.
      - name: Is there anything to release?
        id: guard
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No release tag yet: releasing."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_TAG..HEAD" -- \
            'rusteal-*' ue_plugin Cargo.toml)
          if [ -z "$CHANGED" ]; then
            echo "Nothing that goes into a package changed since $LAST_TAG; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $LAST_TAG:"
            echo "$CHANGED"
          fi

      # Semantic versioning: the last released version is whatever crates.io has (the only
      # source that cannot drift from reality); the commits the PR adds on top of main decide
      # the bump — "BREAKING CHANGE:" -> major, "feat:" -> minor, anything else -> patch.
      # Before the first release the anchor is not on crates.io yet: the version in
      # Cargo.toml is then taken as is.
      - name: Get next version
        id: semver
        if: steps.guard.outputs.skip != 'true'
        run: |
          git fetch origin main
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          UA="rusteal-release-workflow (+https://github.com/viniciusmorgado/rusteal)"
          RELEASED=$(curl -sf -A "$UA" "https://crates.io/api/v1/crates/$ANCHOR_CRATE" \
            | grep -o '"max_version":"[^"]*"' | cut -d'"' -f4 || true)
          if [ -z "$RELEASED" ]; then
            echo "$ANCHOR_CRATE is not on crates.io yet: keeping $CURRENT for the first release."
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECTS=$(git log --format=%s origin/main..HEAD | grep -v '^chore: bump version' || true)
          if echo "$SUBJECTS" | grep -q '^BREAKING CHANGE:'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -q '^feat'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASED"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Released (crates.io): $RELEASED, bump: $BUMP, next: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One version for the whole workspace: [workspace.package].version, which every crate
      # inherits, and the internal dependencies that carry it for the published manifests.
      - name: Commit the version to the PR branch
        if: steps.guard.outputs.skip != 'true'
        run: |
          TARGET_VERSION="${{ steps.semver.outputs.version }}"
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Cargo.toml is already at version $TARGET_VERSION; nothing to commit."
          else
            sed -i '0,/^version = ".*"/s//version = "'"$TARGET_VERSION"'"/' Cargo.toml
            sed -i 's/{ version = "[^"]*", path =/{ version = "'"$TARGET_VERSION"'", path =/' Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The plugins carry the same version (rusteal-cli/tests/plugin_version.rs):
            # VersionName as is, Version as the integer UE requires there.
            IFS=. read -r MAJOR MINOR PATCH <<< "$TARGET_VERSION"
            VERSION_INT=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
            UPLUGINS="ue_plugin/Rusteal/Rusteal.uplugin ue_plugin/RustealGenerator/RustealGenerator.uplugin"
            for UPLUGIN in $UPLUGINS; do
              sed -i -e 's/^\(\s*"Version": \)[0-9]*,$/\1'"$VERSION_INT"',/' \
                -e 's/^\(\s*"VersionName": \)"[^"]*",$/\1"'"$TARGET_VERSION"'",/' "$UPLUGIN"
            done
            git add Cargo.toml $UPLUGINS
            git commit -m "chore: bump version to $TARGET_VERSION"
            git push origin HEAD:${{ github.head_ref }}
          fi
