[package]
name = "rusteal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for Rust gameplay code in Unreal Engine 5"

[dependencies]
rusteal-ffi = { workspace = true }
rusteal-core = { workspace = true }
rusteal-macros = { workspace = true }
rusteal-ue-flags = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
trybuild = { workspace = true }

[features]
static-link = []
engine-allocator = ["static-link"]
rayon = ["dep:rayon"]
