[workspace]
members = [
    "rusteal-ue-flags",
    "rusteal-ffi",
    "rusteal-core",
    "rusteal-macros",
    "rusteal-codegen",
    "rusteal-cli",
    "rusteal-runtime",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viniciusmorgado/rusteal"
homepage = "https://github.com/viniciusmorgado/rusteal"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
glam = "0.33.8"
inventory = "0.3.24"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
serde_json = "1.0.151"
dirs = "7.0.0"
tera = { version = "2.4.0", default-features = false }

# Internal dependencies
rusteal-ue-flags = { version = "0.2.1", path = "rusteal-ue-flags" }
rusteal-codegen = { version = "0.2.1", path = "rusteal-codegen" }
rusteal-core = { version = "0.2.1", path = "rusteal-core" }
rusteal-ffi = { version = "0.2.1", path = "rusteal-ffi" }
rusteal-macros = { version = "0.2.1", path = "rusteal-macros" }
