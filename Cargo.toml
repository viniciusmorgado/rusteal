[workspace]
members = [
    "rusteal-ue-flags",
    "rusteal-ffi",
    "rusteal-core",
    "rusteal-macros",
    "rusteal-codegen",
    "rusteal-cli",
    "rusteal-runtime",
    "xtask",
]
exclude = ["target"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viniciusmorgado/rusteal"
homepage = "https://github.com/viniciusmorgado/rusteal"

[workspace.dependencies]
toml = "1.1.8"
glam = "0.34.1"
inventory = "0.3.25"
rayon = "1.12.0"
log = "0.4"
quote = "1.0.47"
proc-macro2 = "1.0.107"
serde_json = "1.0.152"
dirs = "7.0.0"
criterion = "0.8.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.7", features = ["full", "extra-traits"] }
tera = { version = "2.4.0", default-features = false }

# Internal dependencies
rusteal-ue-flags = { version = "0.9.0", path = "rusteal-ue-flags" }
rusteal-codegen = { version = "0.9.0", path = "rusteal-codegen" }
rusteal-core = { version = "0.9.0", path = "rusteal-core" }
rusteal-ffi = { version = "0.9.0", path = "rusteal-ffi" }
rusteal-macros = { version = "0.9.0", path = "rusteal-macros" }
