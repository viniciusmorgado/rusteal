# `rusteal new <Name> --template <template> --feature interactables`, or
# `rusteal plugin new Interactables --template interactables` in an existing project.
description = "Triggers, lights, a door they unlock, confetti, a level sequence trigger, a MetaSound with a seed and dangling physics blocks, as the Intro To Unreal template's, in an Interactables plugin."

# Printed when the plugin is ready (Tera, same context as the files).
next_step = "place a BP_DoorTrigger and a BP_DoorFrame_Unlockable (Plugins > Interactables Content), set the door's Trigger to the trigger, press Play and step on it"

[feature]
# The plugin's name in the project; its assets live under /Interactables/.
plugin = "Interactables"
# The door frame and cube meshes.
shared_packs = ["High/LevelPrototyping"]
# Epic's assets the Blueprints use (materials, meshes, textures, effects,
# sounds), from the installed engine's Intro To Unreal template: each is
# copied, with every file of it, to the project's Content/ at its path in the
# template (/Game/DemoTemplate/...), skipping what the project already has.
template_assets = [
    "TP_UEIntro_BP/Content/DemoTemplate/Blueprint/M_Light",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/MS_TuningFork",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/M_Distort",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/M_Fork",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/NS_Sound",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/NewSoundAttenuation",
    "TP_UEIntro_BP/Content/DemoTemplate/Metasounds/SM_TuningFork",
    "TP_UEIntro_BP/Content/DemoTemplate/Templates/Confetti/M_GoldConfetti",
    "TP_UEIntro_BP/Content/DemoTemplate/Templates/Confetti/NS_Confetti",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/MI_Intro_Colorway",
]
