# `rusteal new <Name> --template <template> --feature tour`, or
# `rusteal plugin new Tour --template tour` in an existing project.
description = "The guided tour pieces of the Intro To Unreal template: text that changes in game, station titles, animated keys and mouse, a transform gizmo demo, template cubes, decal paths along a spline and editor hints, in a Tour plugin."

# Printed when the plugin is ready (Tera, same context as the files).
next_step = "place a BP_KeyboardKey (Plugins > Tour Content), set its Key, and a BP_GizmoDemo with a Selection, then press Play"

[feature]
# The plugin's name in the project; its assets live under /Tour/.
plugin = "Tour"
# The chamfered cube the gizmo demo and the template cubes use.
shared_packs = ["High/LevelPrototyping"]
# Epic's assets the Blueprints use (materials, meshes, textures, effects,
# sounds), from the installed engine's Intro To Unreal template: each is
# copied, with every file of it, to the project's Content/ at its path in the
# template (/Game/DemoTemplate/...), skipping what the project already has.
template_assets = [
    "TP_UEIntro_BP/Content/DemoTemplate/Templates/M_BoxArt",
    "TP_UEIntro_BP/Content/DemoTemplate/Templates/M_TemplateBox",
    "TP_UEIntro_BP/Content/DemoTemplate/Templates/T__0006_TP_Vehicle",
    "TP_UEIntro_BP/Content/DemoTemplate/Transform/M_Move",
    "TP_UEIntro_BP/Content/DemoTemplate/Transform/M_Rotate",
    "TP_UEIntro_BP/Content/DemoTemplate/Transform/SM_Gizmo_Location",
    "TP_UEIntro_BP/Content/DemoTemplate/Transform/SM_Gizmo_Rotate",
    "TP_UEIntro_BP/Content/DemoTemplate/Transform/SM_Gizmo_Scale",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/M_Gradient",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_ContentDrawer",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_ContentDrawer_Asset",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_ContentDrawer_Tab",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_DetailsPanel_Coll",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_DetailsPanel_CollList",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/T_Outliner",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/EditorUI/Transform",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/SplinePath/M_Corner",
    "TP_UEIntro_BP/Content/DemoTemplate/_Core/SplinePath/M_D_Direction",
]
